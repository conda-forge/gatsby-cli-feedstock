{% set version = "5.16.0" %}

package:
  name: gatsby-cli
  version: {{ version }}

source:
  url: https://registry.npmjs.org/gatsby-cli/-/gatsby-cli-{{ version }}.tgz
  sha256: 312014d94558e08b829c5aadf736ecc6a221d137c3e1bcaa3812bbe23eea5bab

build:
  number: 0
  skip: true  # [win or ppc64le]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - findutils
    - jq
    - make
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs
    - xsel  # [linux]

test:
  commands:
    - gatsby --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: The best React-based framework with performance, scalability and security built in.
  home: https://github.com/gatsbyjs/gatsby-cli
  dev_url: https://github.com/gatsbyjs/gatsby-cli

extra:
  recipe-maintainers:
    - danielnachun
