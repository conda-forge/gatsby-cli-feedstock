{% set version = "5.15.0" %}

package:
  name: gatsby-cli
  version: {{ version }}

source:
  url: https://registry.npmjs.org/gatsby-cli/-/gatsby-cli-{{ version }}.tgz
  sha256: c0da7d8dc8c58801afc1e2b762f929114476ef0bafe087e0d785448d55505209

build:
  number: 0
  skip: true  # [win or ppc64le]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - findutils
    - jq
    - make
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs
    - xsel  # [linux]

test:
  commands:
    - gatsby --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: The best React-based framework with performance, scalability and security built in.
  home: https://github.com/gatsbyjs/gatsby-cli
  dev_url: https://github.com/gatsbyjs/gatsby-cli

extra:
  recipe-maintainers:
    - danielnachun
